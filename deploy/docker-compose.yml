# Dashboard atrás de um nginx com senha. Rodar a partir da pasta deploy/:
#   docker compose up -d --build
# Antes, gerar o banco (src/banco.py) e o arquivo de senhas (.htpasswd).
services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - streamlit

  streamlit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - ../dados/processados/cronosaude.db:/data/cronosaude.db:ro
