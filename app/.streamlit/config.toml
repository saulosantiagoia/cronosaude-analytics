[server]
headless = true
address = "0.0.0.0"
port = 8501
# Aceita conexões só a partir do domínio do projeto.
enableCORS = true
corsAllowedOrigins = ["https://cronosaude.online", "https://www.cronosaude.online"]
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
primaryColor = "#1f6f74"
